<text x="40" y="614" font-size="12" fill="#555555">Left motors: ENA/IN1/IN2 (D2,D3,D4).  Right motors: ENB/IN3/IN4 (D7,D5,D6).</text>
<text x="40" y="638" font-size="12" fill="#555555">Sensor link note: code defines LINK_RX as pin 10, but the header comment in the</text>
<text x="40" y="662" font-size="12" fill="#555555">original file said pin 12 -- confirm which pin your sensor Arduino's TX is actually</text>
<text x="40" y="686" font-size="12" fill="#555555">wired to and keep the #define and the physical wire in agreement.</text>
<text x="40" y="710" font-size="12" fill="#555555">Optional: USB serial (from a Raspberry Pi or PC) can also send single-char</text>
<text x="40" y="734" font-size="12" fill="#555555">commands F/B/L/R/S to drive the car.</text>
