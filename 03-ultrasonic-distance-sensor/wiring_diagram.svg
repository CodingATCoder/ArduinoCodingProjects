<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="406" viewBox="0 0 1020 406" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1020" height="406" fill="#ffffff"/>
<text x="510.0" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Project 3: Ultrasonic Distance Sensor (Serial Readout)</text>
<rect x="40" y="90" width="200" height="160" rx="10" fill="#e8f0fe" stroke="#2c5282" stroke-width="2"/>
<text x="140.0" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#1a365d">Arduino Uno</text>
<line x1="54" y1="130" x2="226" y2="130" stroke="#2c5282" stroke-width="1"/>
<circle cx="234" cy="156" r="4" fill="#2c5282"/>
<text x="222" y="161" text-anchor="end" font-size="13" fill="#1a365d">D8</text>
<circle cx="234" cy="184" r="4" fill="#2c5282"/>
<text x="222" y="189" text-anchor="end" font-size="13" fill="#1a365d">D9</text>
<circle cx="234" cy="212" r="4" fill="#2c5282"/>
<text x="222" y="217" text-anchor="end" font-size="13" fill="#1a365d">5V</text>
<circle cx="234" cy="240" r="4" fill="#2c5282"/>
<text x="222" y="245" text-anchor="end" font-size="13" fill="#1a365d">GND</text>
<rect x="620" y="90" width="340" height="145" rx="10" fill="#fef8f2" stroke="#c05621" stroke-width="2"/>
<text x="790.0" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#c05621">
<tspan x="790.0" dy="0">HC-SR04 Ultrasonic Sensor</tspan>
</text>
<circle cx="620" cy="137" r="4" fill="#c05621"/>
<text x="630" y="142" font-size="12" fill="#4a4a4a">Trig</text>
<path d="M 234 184 C 427.0 184, 427.0 137, 620 137" fill="none" stroke="#c05621" stroke-width="2"/>
<circle cx="620" cy="161" r="4" fill="#c05621"/>
<text x="630" y="166" font-size="12" fill="#4a4a4a">Echo</text>
<path d="M 234 156 C 427.0 156, 427.0 161, 620 161" fill="none" stroke="#c05621" stroke-width="2"/>
<circle cx="620" cy="185" r="4" fill="#c05621"/>
<text x="630" y="190" font-size="12" fill="#4a4a4a">VCC</text>
<path d="M 234 212 C 427.0 212, 427.0 185, 620 185" fill="none" stroke="#c05621" stroke-width="2"/>
<circle cx="620" cy="209" r="4" fill="#c05621"/>
<text x="630" y="214" font-size="12" fill="#4a4a4a">GND</text>
<path d="M 234 240 C 427.0 240, 427.0 209, 620 209" fill="none" stroke="#c05621" stroke-width="2"/>
<text x="40" y="294" font-size="12" fill="#555555">Prints live distance (cm) to Serial Monitor at 115200 baud every ~200ms.</text>
<text x="40" y="318" font-size="12" fill="#555555">Note: pulseIn(8, HIGH) here has no timeout, so it can block indefinitely if no</text>
<text x="40" y="342" font-size="12" fill="#555555">echo returns (sensor unplugged / object out of range). Consider a timeout, e.g.</text>
<text x="40" y="366" font-size="12" fill="#555555">pulseIn(8, HIGH, 30000), for a more robust standalone sketch.</text>
</svg>