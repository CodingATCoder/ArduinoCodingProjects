<text x="40" y="737" font-size="12" fill="#555555">Line sensor drives servo1/servo2 in opposite directions to steer toward the line.</text>
<text x="40" y="761" font-size="12" fill="#555555">Ultrasonic.h / pins 8+9 are wired and pinMode'd but getUltraSonicDistance() is not</text>
<text x="40" y="785" font-size="12" fill="#555555">yet called from loop() -- ready to wire in obstacle-avoidance later.</text>
<text x="40" y="809" font-size="12" fill="#555555">Power servos from a separate 5-6V supply if you see brownouts/resets under load.</text>
